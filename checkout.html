<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Checkout Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        button { padding: 8px; margin: 5px 0; cursor: pointer; }
    </style>
</head>
<body>
<h2>Order Checkout & History Test Panel</h2>

<div class="card">
    <h3>1. Finalize Order (Checkout)</h3>
    <p>This will convert all items currently in User 1's cart into an official order, apply a $5.00 delivery fee, and empty the cart.</p>
    <button onclick="checkoutCart()">Pay & Place Order</button>
    <p id="checkoutStatus"></p>
</div>

<div class="card">
    <h3>2. My Order History (User ID: 1)</h3>
    <button onclick="loadOrders()">Refresh Orders</button>
    <table>
        <thead>
        <tr>
            <th>Order ID</th>
            <th>Total Amount</th>
            <th>Delivery Fee</th>
            <th>Status</th>
            <th>Date</th>
        </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
    </table>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';
    const TEST_USER_ID = 1;

    async function checkoutCart() {
        const statusText = document.getElementById('checkoutStatus');
        statusText.innerText = "Processing...";

        const res = await fetch(`${API_URL}/orders/checkout`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: TEST_USER_ID })
        });
        const result = await res.json();

        if (res.ok) {
            alert(`Success! Order #${result.order_id} placed. Total: $${result.total_amount}`);
            statusText.innerText = "Order placed successfully!";
            loadOrders(); // Refresh the table
        } else {
            alert('Error: ' + result.error);
            statusText.innerText = "Failed: " + result.error;
        }
    }

    async function loadOrders() {
        const res = await fetch(`${API_URL}/orders/${TEST_USER_ID}`);
        const orders = await res.json();
        const tbody = document.getElementById('ordersTable');
        tbody.innerHTML = '';

        orders.forEach(order => {
            const date = new Date(order.created_at).toLocaleString();
            tbody.innerHTML += `
                    <tr>
                        <td>#${order.id}</td>
                        <td>$${order.total_amount.toFixed(2)}</td>
                        <td>$${order.delivery_fee.toFixed(2)}</td>
                        <td><b>${order.status}</b></td>
                        <td>${date}</td>
                    </tr>
                `;
        });
    }

    // Load initially
    loadOrders();
</script>
</body>
</html>
