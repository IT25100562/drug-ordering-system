<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prescription Management Test UI</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>
<h2>Prescription Module Test Panel</h2>

<div class="card">
    <h3>1. Upload Prescription</h3>
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>
</div>

<div class="card">
    <h3>2. Submitted Prescriptions</h3>
    <button onclick="loadPrescriptions()">Refresh List</button>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>File</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="prescriptionTable"></tbody>
    </table>
</div>

<script>
    const API_URL = 'http://localhost:3000/api/prescriptions';

    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) return alert('Select a file');

        const formData = new FormData();
        formData.append('prescription', fileInput.files[0]);
        formData.append('user_id', 1);

        const res = await fetch(`${API_URL}/upload`, { method: 'POST', body: formData });
        const data = await res.json();
        alert(data.message);
        loadPrescriptions();
    }

    async function loadPrescriptions() {
        const res = await fetch(API_URL);
        const data = await res.json();
        const tbody = document.getElementById('prescriptionTable');
        tbody.innerHTML = '';

        data.forEach(item => {
            tbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td><a href="http://localhost:3000/uploads/${item.file_path}" target="_blank">View File</a></td>
                        <td><strong>${item.status}</strong></td>
                        <td>
                            <button onclick="updateStatus(${item.id}, 'approved')">Approve</button>
                            <button onclick="updateStatus(${item.id}, 'rejected')">Reject</button>
                        </td>
                    </tr>
                `;
        });
    }

    async function updateStatus(id, status) {
        await fetch(`${API_URL}/${id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
        loadPrescriptions();
    }

    loadPrescriptions();
</script>
</body>
</html>
