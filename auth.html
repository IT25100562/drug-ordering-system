<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        input, select, button { margin: 5px 0; padding: 8px; width: 100%; box-sizing: border-box; }
        pre { background: #eee; padding: 10px; overflow-x: auto; border-radius: 4px; }
    </style>
</head>
<body>
<h2>User Authentication Test Panel</h2>

<div class="card">
    <h3>1. Register New User</h3>
    <input type="text" id="regName" placeholder="Full Name (e.g. John Doe)">
    <input type="email" id="regEmail" placeholder="Email Address">
    <input type="password" id="regPassword" placeholder="Password">
    <select id="regRole">
        <option value="customer">Customer</option>
        <option value="pharmacist">Pharmacist</option>
        <option value="admin">Admin</option>
    </select>
    <button onclick="register()">Register Account</button>
</div>

<div class="card">
    <h3>2. Login</h3>
    <input type="email" id="loginEmail" placeholder="Email Address">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<div class="card">
    <h3>3. Server Response (JWT Token)</h3>
    <pre id="output">Waiting for login...</pre>
</div>

<script>
    const API_URL = 'http://localhost:3000/api/users';

    async function register() {
        const data = {
            full_name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            role: document.getElementById('regRole').value
        };

        const res = await fetch(`${API_URL}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await res.json();
        if (res.ok) {
            alert('User Registered Successfully!');
        } else {
            alert('Registration Error: ' + result.error);
        }
    }

    async function login() {
        const data = {
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
        };

        const res = await fetch(`${API_URL}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await res.json();
        const output = document.getElementById('output');

        if (res.ok) {
            output.textContent = JSON.stringify(result, null, 2);
            alert('Login Successful!');
        } else {
            output.textContent = 'Error: ' + result.error;
            alert('Login Failed!');
        }
    }
</script>
</body>
</html>
