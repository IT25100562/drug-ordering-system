<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Module Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        input, button { margin: 5px 0; padding: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>
<h2>Medicine Inventory Test Panel</h2>

<div class="card">
    <h3>1. Add New Medicine</h3>
    <input type="text" id="name" placeholder="Medicine Name (e.g. Panadol)"><br>
    <input type="text" id="category" placeholder="Category (e.g. Painkiller)"><br>
    <input type="number" id="price" placeholder="Price (e.g. 150.00)"><br>
    <input type="number" id="stock" placeholder="Stock Quantity (e.g. 100)"><br>
    <button onclick="addMedicine()">Add Medicine</button>
</div>

<div class="card">
    <h3>2. Inventory List</h3>
    <button onclick="loadMedicines()">Refresh List</button>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="inventoryTable"></tbody>
    </table>
</div>

<script>
    const API_URL = 'http://localhost:3000/api/medicines';

    async function addMedicine() {
        const data = {
            name: document.getElementById('name').value,
            category: document.getElementById('category').value,
            price: parseFloat(document.getElementById('price').value),
            stock_quantity: parseInt(document.getElementById('stock').value)
        };

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        alert('Medicine added!');
        loadMedicines();
    }

    async function loadMedicines() {
        const res = await fetch(API_URL);
        const medicines = await res.json();
        const tbody = document.getElementById('inventoryTable');
        tbody.innerHTML = '';

        medicines.forEach(item => {
            tbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.category}</td>
                        <td>$${item.price}</td>
                        <td>${item.stock_quantity}</td>
                        <td>
                            <button onclick="discontinue(${item.id})">Discontinue</button>
                        </td>
                    </tr>
                `;
        });
    }

    async function discontinue(id) {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        loadMedicines();
    }

    loadMedicines();
</script>
</body>
</html>
