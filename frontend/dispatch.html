<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Dispatch Orders</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Modern Clinical Theme Customizations */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
        }
        .medical-nav {
            background-color: #00695c !important;
        }
        .content-card {
            border-radius: 12px;
            border: none;
            overflow: hidden;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark medical-nav shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            <i class="bi bi-arrow-left-short me-1 fs-5 align-middle"></i>Back to Dashboard
        </a>
        <span class="text-light fw-medium"><i class="bi bi-shield-lock me-2"></i>Admin Access</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-6">
            <div class="card content-card shadow-sm">
                <div class="card-header bg-dark text-white py-3">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-truck me-2 text-warning"></i>Update Delivery Status</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-4">Enter an Order ID to update its shipping status. This will automatically send a tracking notification to the customer.</p>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark">Order ID</label>
                        <input type="number" id="orderId" class="form-control form-control-lg rounded-3" placeholder="e.g. 1">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark">New Status</label>
                        <select id="newStatus" class="form-select form-select-lg rounded-3">
                            <option value="Pending">Pending (Default)</option>
                            <option value="Dispatched">Dispatched</option>
                            <option value="In Transit">In Transit</option>
                            <option value="Delivered">Delivered</option>
                        </select>
                    </div>

                    <button class="btn btn-primary btn-lg w-100 rounded-pill fw-medium shadow-sm" onclick="updateOrderStatus()">
                        <i class="bi bi-send-check me-2"></i>Push Update to Customer
                    </button>

                    <div id="statusAlert" class="alert mt-3 d-none rounded-3" role="alert"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    // Security check: Must be admin or pharmacist
    const userStr = localStorage.getItem('user');
    if (!userStr) window.location.href = 'index.html';
    const user = JSON.parse(userStr);
    if (user.role !== 'admin' && user.role !== 'pharmacist') {
        alert('Access Denied. You do not have admin privileges.');
        window.location.href = 'dashboard.html';
    }

    async function updateOrderStatus() {
        const orderId = document.getElementById('orderId').value;
        const status = document.getElementById('newStatus').value;
        const alertBox = document.getElementById('statusAlert');

        if (!orderId) {
            alertBox.className = 'alert alert-danger mt-3 rounded-3';
            alertBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i>Please enter a valid Order ID.';
            return;
        }

        alertBox.className = 'alert alert-info mt-3 rounded-3';
        alertBox.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Updating...';

        try {
            const res = await fetch(`${API_URL}/orders/${orderId}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            const result = await res.json();

            if (res.ok) {
                alertBox.className = 'alert alert-success mt-3 rounded-3';
                alertBox.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i><strong>Success!</strong> ${result.message}`;
                document.getElementById('orderId').value = ''; // clear input
            } else {
                alertBox.className = 'alert alert-danger mt-3 rounded-3';
                alertBox.innerHTML = `<i class="bi bi-x-circle-fill me-2"></i>Error: ${result.error}`;
            }
        } catch (err) {
            alertBox.className = 'alert alert-danger mt-3 rounded-3';
            alertBox.innerHTML = '<i class="bi bi-wifi-off me-2"></i>Connection error. Is the server running?';
        }
    }
</script>
</body>
</html>
