<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Dispatch Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">⬅ Back to Dashboard</a>
        <span class="text-light" id="adminBadge">Admin Access</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">🚚 Update Delivery Status</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-4">Enter an Order ID to update its shipping status. This will automatically send a tracking notification to the customer.</p>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Order ID</label>
                        <input type="number" id="orderId" class="form-control form-control-lg" placeholder="e.g. 1">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">New Status</label>
                        <select id="newStatus" class="form-select form-select-lg">
                            <option value="Pending">Pending (Default)</option>
                            <option value="Dispatched">Dispatched</option>
                            <option value="In Transit">In Transit</option>
                            <option value="Delivered">Delivered</option>
                        </select>
                    </div>

                    <button class="btn btn-primary btn-lg w-100" onclick="updateOrderStatus()">Push Update to Customer</button>

                    <div id="statusAlert" class="alert mt-3 d-none" role="alert"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    // Security check: Must be admin or pharmacist
    const userStr = localStorage.getItem('user');
    if (!userStr) window.location.href = 'index.html';
    const user = JSON.parse(userStr);
    if (user.role !== 'admin' && user.role !== 'pharmacist') {
        alert('Access Denied. You do not have admin privileges.');
        window.location.href = 'dashboard.html';
    }

    async function updateOrderStatus() {
        const orderId = document.getElementById('orderId').value;
        const status = document.getElementById('newStatus').value;
        const alertBox = document.getElementById('statusAlert');

        if (!orderId) {
            alertBox.className = 'alert alert-danger mt-3';
            alertBox.textContent = 'Please enter a valid Order ID.';
            return;
        }

        alertBox.className = 'alert alert-info mt-3';
        alertBox.textContent = 'Updating...';

        try {
            const res = await fetch(`${API_URL}/orders/${orderId}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            const result = await res.json();

            if (res.ok) {
                alertBox.className = 'alert alert-success mt-3';
                alertBox.innerHTML = `<strong>Success!</strong> ${result.message}`;
                document.getElementById('orderId').value = ''; // clear input
            } else {
                alertBox.className = 'alert alert-danger mt-3';
                alertBox.textContent = 'Error: ' + result.error;
            }
        } catch (err) {
            alertBox.className = 'alert alert-danger mt-3';
            alertBox.textContent = 'Connection error. Is the server running?';
        }
    }
</script>
</body>
</html>
