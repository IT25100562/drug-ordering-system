<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">⬅ Back to Dashboard</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">

        <!-- Left Side: Order History -->
        <div class="col-md-8">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-white">
                    <h4 class="mb-0">My Order History</h4>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Order #</th>
                            <th>Date</th>
                            <th>Total</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody id="ordersTable">
                        <!-- Orders injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Right Side: Notifications -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Notifications</h5>
                    <button class="btn btn-sm btn-light" onclick="markAllRead()">Mark Read</button>
                </div>
                <ul class="list-group list-group-flush" id="notificationsList">
                    <!-- Notifications injected here -->
                </ul>
            </div>
        </div>

    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    // Security check
    const userStr = localStorage.getItem('user');
    if (!userStr) window.location.href = 'index.html';
    const user = JSON.parse(userStr);

    // 1. LOAD ORDERS
    async function loadOrders() {
        const res = await fetch(`${API_URL}/orders/${user.id}`);
        const orders = await res.json();
        const tbody = document.getElementById('ordersTable');
        tbody.innerHTML = '';

        if (orders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No orders found.</td></tr>';
            return;
        }

        orders.forEach(order => {
            const date = new Date(order.created_at).toLocaleDateString();

            // Color-code the status
            let statusBadge = 'bg-secondary';
            if (order.status === 'Dispatched') statusBadge = 'bg-primary';
            if (order.status === 'In Transit') statusBadge = 'bg-warning text-dark';
            if (order.status === 'Delivered') statusBadge = 'bg-success';

            tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">#${order.id}</td>
                        <td>${date}</td>
                        <td>$${order.total_amount.toFixed(2)}</td>
                        <td><span class="badge ${statusBadge}">${order.status}</span></td>
                    </tr>
                `;
        });
    }

    // 2. LOAD NOTIFICATIONS
    async function loadNotifications() {
        const res = await fetch(`${API_URL}/notifications/${user.id}`);
        const notifications = await res.json();
        const list = document.getElementById('notificationsList');
        list.innerHTML = '';

        if (notifications.length === 0) {
            list.innerHTML = '<li class="list-group-item text-muted text-center py-3">No new notifications.</li>';
            return;
        }

        notifications.forEach(notif => {
            const isUnread = notif.is_read ? '' : 'fw-bold bg-light';
            const dot = notif.is_read ? '' : '<span class="badge bg-danger rounded-pill">New</span>';

            list.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center ${isUnread}">
                        <small>${notif.message}</small>
                        ${dot}
                    </li>
                `;
        });
    }

    // 3. MARK AS READ
    async function markAllRead() {
        await fetch(`${API_URL}/notifications/${user.id}/read`, { method: 'PUT' });
        loadNotifications();
    }

    // Initialize page
    loadOrders();
    loadNotifications();
</script>
</body>
</html>
