<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - My Orders</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Modern Clinical Theme Customizations */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
        }
        .medical-nav {
            background-color: #00695c !important;
        }
        .content-card {
            border-radius: 12px;
            border: none;
            overflow: hidden;
        }
        .table > :not(caption) > * > * {
            padding: 1rem 1.5rem;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark medical-nav shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            <i class="bi bi-arrow-left-short me-1 fs-5 align-middle"></i>Back to Dashboard
        </a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row gap-4 justify-content-center">

        <!-- Left Side: Order History -->
        <div class="col-lg-7 col-md-12">
            <div class="card content-card shadow-sm mb-4">
                <div class="card-header bg-white border-bottom py-3">
                    <h4 class="mb-0 fw-bold text-dark"><i class="bi bi-box-seam text-primary me-2"></i>My Order History</h4>
                </div>
                <div class="card-body p-0 table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th class="text-secondary fw-semibold">Order #</th>
                            <th class="text-secondary fw-semibold">Date</th>
                            <th class="text-secondary fw-semibold">Total</th>
                            <th class="text-secondary fw-semibold">Status</th>
                        </tr>
                        </thead>
                        <tbody id="ordersTable">
                        <!-- Orders injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Right Side: Notifications -->
        <div class="col-lg-4 col-md-12">
            <div class="card content-card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-bell-fill text-warning me-2"></i>Notifications</h5>
                    <button class="btn btn-sm btn-light rounded-pill fw-medium text-primary px-3 shadow-sm" onclick="markAllRead()">
                        <i class="bi bi-check2-all me-1"></i>Mark Read
                    </button>
                </div>
                <ul class="list-group list-group-flush" id="notificationsList">
                    <!-- Notifications injected here -->
                </ul>
            </div>
        </div>

    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    // Security check
    const userStr = localStorage.getItem('user');
    if (!userStr) window.location.href = 'index.html';
    const user = JSON.parse(userStr);

    // 1. LOAD ORDERS
    async function loadOrders() {
        const res = await fetch(`${API_URL}/orders/${user.id}`);
        const orders = await res.json();
        const tbody = document.getElementById('ordersTable');
        tbody.innerHTML = '';

        if (orders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-5"><i class="bi bi-inbox fs-2 d-block mb-2"></i>No orders found.</td></tr>';
            return;
        }

        orders.forEach(order => {
            const date = new Date(order.created_at).toLocaleDateString();

            // Color-code the status
            let statusBadge = 'bg-secondary';
            if (order.status === 'Dispatched') statusBadge = 'bg-primary';
            if (order.status === 'In Transit') statusBadge = 'bg-warning text-dark';
            if (order.status === 'Delivered') statusBadge = 'bg-success';

            tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold text-muted">#${order.id}</td>
                        <td class="text-muted">${date}</td>
                        <td class="fw-medium text-dark">$${order.total_amount.toFixed(2)}</td>
                        <td><span class="badge ${statusBadge} rounded-pill px-3 py-2 fw-medium shadow-sm">${order.status}</span></td>
                    </tr>
                `;
        });
    }

    // 2. LOAD NOTIFICATIONS
    async function loadNotifications() {
        const res = await fetch(`${API_URL}/notifications/${user.id}`);
        const notifications = await res.json();
        const list = document.getElementById('notificationsList');
        list.innerHTML = '';

        if (notifications.length === 0) {
            list.innerHTML = '<li class="list-group-item text-muted text-center py-5"><i class="bi bi-bell-slash fs-2 d-block mb-2 text-light"></i>No new notifications.</li>';
            return;
        }

        notifications.forEach(notif => {
            const isUnread = notif.is_read ? 'text-muted' : 'fw-medium bg-light border-start border-4 border-primary';
            const dot = notif.is_read ? '' : '<span class="badge bg-danger rounded-pill shadow-sm">New</span>';

            list.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3 ${isUnread}">
                        <small class="pe-3"><i class="bi bi-info-circle text-primary me-2"></i>${notif.message}</small>
                        ${dot}
                    </li>
                `;
        });
    }

    // 3. MARK AS READ
    async function markAllRead() {
        await fetch(`${API_URL}/notifications/${user.id}/read`, { method: 'PUT' });
        loadNotifications();
    }

    // Initialize page
    loadOrders();
    loadNotifications();
</script>
</body>
</html>
