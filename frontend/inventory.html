<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Manage Inventory</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Modern Clinical Theme Customizations */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
        }
        .medical-nav {
            background-color: #00695c !important;
        }
        .content-card {
            border-radius: 12px;
            border: none;
            overflow: hidden;
        }
        .form-control {
            border-radius: 0.5rem;
        }
        .table > :not(caption) > * > * {
            padding: 1rem 1.5rem;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark medical-nav shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            <i class="bi bi-arrow-left-short me-1 fs-5 align-middle"></i>Back to Dashboard
        </a>
        <span class="text-light fw-medium"><i class="bi bi-shield-lock me-2"></i>Admin Access</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row gap-4 justify-content-center">

        <!-- Left Side: Add Medicine Form -->
        <div class="col-lg-4 col-md-5">
            <div class="card content-card shadow-sm sticky-top" style="top: 20px;">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-plus-circle-fill text-primary me-2"></i>Add Medicine</h5>
                </div>
                <div class="card-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-medium text-secondary">Name</label>
                        <input type="text" id="medName" class="form-control bg-light" placeholder="e.g. Amoxicillin">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium text-secondary">Category</label>
                        <input type="text" id="medCategory" class="form-control bg-light" placeholder="e.g. Antibiotic">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium text-secondary">Price ($)</label>
                        <input type="number" id="medPrice" class="form-control bg-light" step="0.01" placeholder="0.00">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium text-secondary">Stock Quantity</label>
                        <input type="number" id="medStock" class="form-control bg-light" placeholder="0">
                    </div>
                    <button class="btn btn-primary w-100 rounded-pill fw-medium shadow-sm" onclick="addMedicine()">
                        <i class="bi bi-plus-lg me-1"></i>Add to Inventory
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Side: Inventory Table -->
        <div class="col-lg-7 col-md-12">
            <div class="card content-card shadow-sm">
                <div class="card-header bg-white border-bottom py-3 d-flex align-items-center">
                    <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-capsule text-warning me-2 fs-4 align-middle"></i>Current Stock</h5>
                </div>
                <div class="card-body p-0 table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th class="text-secondary fw-semibold">ID</th>
                            <th class="text-secondary fw-semibold">Name</th>
                            <th class="text-secondary fw-semibold">Category</th>
                            <th class="text-secondary fw-semibold">Price</th>
                            <th class="text-secondary fw-semibold">Stock</th>
                            <th class="text-secondary fw-semibold">Action</th>
                        </tr>
                        </thead>
                        <tbody id="inventoryTable">
                        <!-- Medicines injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    // Security check: Must be admin or pharmacist
    const userStr = localStorage.getItem('user');
    if (!userStr) window.location.href = 'index.html';
    const user = JSON.parse(userStr);
    if (user.role !== 'admin' && user.role !== 'pharmacist') {
        alert('Access Denied. You do not have admin privileges.');
        window.location.href = 'dashboard.html';
    }

    // 1. LOAD INVENTORY
    async function loadInventory() {
        const res = await fetch(`${API_URL}/medicines`);
        const medicines = await res.json();
        const tbody = document.getElementById('inventoryTable');
        tbody.innerHTML = '';

        if (medicines.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5"><i class="bi bi-inbox fs-2 d-block mb-2"></i>No medicines in stock.</td></tr>';
            return;
        }

        medicines.forEach(med => {
            const stockWarning = med.stock_quantity < 10 ? 'text-danger fw-bold' : 'text-muted';
            tbody.innerHTML += `
                    <tr>
                        <td class="fw-medium text-muted">#${med.id}</td>
                        <td class="fw-bold text-dark">${med.name}</td>
                        <td class="text-muted">${med.category}</td>
                        <td class="fw-medium">$${med.price.toFixed(2)}</td>
                        <td class="${stockWarning}">${med.stock_quantity}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-danger rounded-pill fw-medium px-3" onclick="deleteMedicine(${med.id})">
                                <i class="bi bi-trash3 me-1"></i>Remove
                            </button>
                        </td>
                    </tr>
                `;
        });
    }

    // 2. ADD MEDICINE
    async function addMedicine() {
        const name = document.getElementById('medName').value;
        const category = document.getElementById('medCategory').value;
        const price = parseFloat(document.getElementById('medPrice').value);
        const stock_quantity = parseInt(document.getElementById('medStock').value);

        if (!name || isNaN(price)) return alert('Name and Price are required.');

        const res = await fetch(`${API_URL}/medicines`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, category, price, stock_quantity })
        });

        if (res.ok) {
            alert('Medicine added successfully!');
            // Clear form
            document.getElementById('medName').value = '';
            document.getElementById('medCategory').value = '';
            document.getElementById('medPrice').value = '';
            document.getElementById('medStock').value = '';
            loadInventory(); // Refresh table
        } else {
            const error = await res.json();
            alert('Failed to add medicine: ' + error.error);
        }
    }

    // 3. REMOVE MEDICINE
    async function deleteMedicine(id) {
        if (!confirm('Are you sure you want to remove this medicine?')) return;

        const res = await fetch(`${API_URL}/medicines/${id}`, { method: 'DELETE' });
        if (res.ok) {
            loadInventory(); // Refresh table
        } else {
            alert('Failed to remove medicine.');
        }
    }

    // Initialize
    loadInventory();
</script>
</body>
</html>
