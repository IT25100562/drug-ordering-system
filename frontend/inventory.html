<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Manage Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">⬅ Back to Dashboard</a>
        <span class="text-light" id="adminBadge">Admin Access</span>
    </div>
</nav>

<div class="container mt-4">
    <div class="row gap-4">

        <!-- Left Side: Add Medicine Form -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 sticky-top" style="top: 20px;">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">➕ Add New Medicine</h5>
                </div>
                <div class="card-body">
                    <div class="mb-2">
                        <label class="form-label">Name</label>
                        <input type="text" id="medName" class="form-control" placeholder="e.g. Amoxicillin">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Category</label>
                        <input type="text" id="medCategory" class="form-control" placeholder="e.g. Antibiotic">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Price ($)</label>
                        <input type="number" id="medPrice" class="form-control" step="0.01" placeholder="0.00">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stock Quantity</label>
                        <input type="number" id="medStock" class="form-control" placeholder="0">
                    </div>
                    <button class="btn btn-success w-100" onclick="addMedicine()">Add to Inventory</button>
                </div>
            </div>
        </div>

        <!-- Right Side: Inventory Table -->
        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <h4 class="mb-0">Current Stock</h4>
                </div>
                <div class="card-body p-0 table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody id="inventoryTable">
                        <!-- Medicines injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    // Security check: Must be admin or pharmacist
    const userStr = localStorage.getItem('user');
    if (!userStr) window.location.href = 'index.html';
    const user = JSON.parse(userStr);
    if (user.role !== 'admin' && user.role !== 'pharmacist') {
        alert('Access Denied. You do not have admin privileges.');
        window.location.href = 'dashboard.html';
    }

    // 1. LOAD INVENTORY
    async function loadInventory() {
        const res = await fetch(`${API_URL}/medicines`);
        const medicines = await res.json();
        const tbody = document.getElementById('inventoryTable');
        tbody.innerHTML = '';

        if (medicines.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No medicines in stock.</td></tr>';
            return;
        }

        medicines.forEach(med => {
            const stockWarning = med.stock_quantity < 10 ? 'text-danger fw-bold' : '';
            tbody.innerHTML += `
                    <tr>
                        <td>${med.id}</td>
                        <td class="fw-bold">${med.name}</td>
                        <td>${med.category}</td>
                        <td>$${med.price.toFixed(2)}</td>
                        <td class="${stockWarning}">${med.stock_quantity}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteMedicine(${med.id})">Remove</button>
                        </td>
                    </tr>
                `;
        });
    }

    // 2. ADD MEDICINE
    async function addMedicine() {
        const name = document.getElementById('medName').value;
        const category = document.getElementById('medCategory').value;
        const price = parseFloat(document.getElementById('medPrice').value);
        const stock_quantity = parseInt(document.getElementById('medStock').value);

        if (!name || isNaN(price)) return alert('Name and Price are required.');

        const res = await fetch(`${API_URL}/medicines`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, category, price, stock_quantity })
        });

        if (res.ok) {
            alert('Medicine added successfully!');
            // Clear form
            document.getElementById('medName').value = '';
            document.getElementById('medCategory').value = '';
            document.getElementById('medPrice').value = '';
            document.getElementById('medStock').value = '';
            loadInventory(); // Refresh table
        } else {
            const error = await res.json();
            alert('Failed to add medicine: ' + error.error);
        }
    }

    // 3. REMOVE MEDICINE
    async function deleteMedicine(id) {
        if (!confirm('Are you sure you want to remove this medicine?')) return;

        const res = await fetch(`${API_URL}/medicines/${id}`, { method: 'DELETE' });
        if (res.ok) {
            loadInventory(); // Refresh table
        } else {
            alert('Failed to remove medicine.');
        }
    }

    // Initialize
    loadInventory();
</script>
</body>
</html>
