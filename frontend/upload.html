<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Upload Prescription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">⬅ Back to Dashboard</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">📄 Upload Medical Prescription</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-4">Please upload a clear image or PDF of your doctor's prescription. A pharmacist will review it shortly.</p>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Select File</label>
                        <input type="file" id="fileInput" class="form-control form-control-lg" accept=".jpg,.jpeg,.png,.pdf">
                    </div>

                    <button class="btn btn-primary btn-lg w-100" onclick="uploadPrescription()">Submit Prescription</button>

                    <div id="uploadAlert" class="alert mt-3 d-none" role="alert"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    // Security check
    const userStr = localStorage.getItem('user');
    if (!userStr) window.location.href = 'index.html';
    const user = JSON.parse(userStr);

    async function uploadPrescription() {
        const fileInput = document.getElementById('fileInput');
        const alertBox = document.getElementById('uploadAlert');

        if (fileInput.files.length === 0) {
            alertBox.className = 'alert alert-danger mt-3';
            alertBox.textContent = 'Please select a file to upload.';
            return;
        }

        // We must use FormData for file uploads (multipart/form-data)
        const formData = new FormData();
        formData.append('prescription', fileInput.files[0]);
        formData.append('user_id', user.id);

        alertBox.className = 'alert alert-info mt-3';
        alertBox.textContent = 'Uploading...';

        try {
            const res = await fetch(`${API_URL}/prescriptions/upload`, {
                method: 'POST',
                body: formData // Note: We do NOT set 'Content-Type' manually when using FormData
            });
            const result = await res.json();

            if (res.ok) {
                alertBox.className = 'alert alert-success mt-3';
                alertBox.textContent = 'Success! Your prescription has been securely uploaded.';
                fileInput.value = ''; // Clear the input
            } else {
                alertBox.className = 'alert alert-danger mt-3';
                alertBox.textContent = 'Error: ' + result.error;
            }
        } catch (err) {
            alertBox.className = 'alert alert-danger mt-3';
            alertBox.textContent = 'Upload failed. Check server connection.';
        }
    }
</script>
</body>
</html>
