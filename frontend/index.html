<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Login & Register</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">PharmaCare System</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center gap-4">

        <!-- Login Card -->
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h4 class="card-title mb-4">Account Login</h4>
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
                    </div>
                    <button class="btn btn-primary w-100" onclick="login()">Login</button>
                    <div id="loginAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
                </div>
            </div>
        </div>

        <!-- Registration Card -->
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h4 class="card-title mb-4">Create an Account</h4>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="regName" class="form-control" placeholder="John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="••••••••">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select id="regRole" class="form-select">
                            <option value="customer">Customer</option>
                            <option value="pharmacist">Pharmacist</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <button class="btn btn-success w-100" onclick="register()">Register</button>
                    <div id="regAlert" class="alert mt-3 d-none" role="alert"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api/users';

    // Clear any old tokens when arriving at the login page
    localStorage.removeItem('token');
    localStorage.removeItem('user');

    async function login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const alertBox = document.getElementById('loginAlert');

        try {
            const res = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const result = await res.json();

            if (res.ok) {
                // Securely store the JWT token and user info
                localStorage.setItem('token', result.token);
                localStorage.setItem('user', JSON.stringify(result.user));

                // Redirect to the main dashboard
                window.location.href = 'dashboard.html';
            } else {
                alertBox.textContent = result.error;
                alertBox.classList.remove('d-none');
            }
        } catch (err) {
            console.error('[ERROR] Login failed:', err);
        }
    }

    async function register() {
        const full_name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const role = document.getElementById('regRole').value;
        const alertBox = document.getElementById('regAlert');

        try {
            const res = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name, email, password, role })
            });
            const result = await res.json();

            alertBox.classList.remove('d-none', 'alert-danger', 'alert-success');
            if (res.ok) {
                alertBox.classList.add('alert-success');
                alertBox.textContent = 'Account created successfully! You can now log in.';
            } else {
                alertBox.classList.add('alert-danger');
                alertBox.textContent = result.error;
            }
        } catch (err) {
            console.error('[ERROR] Registration failed:', err);
        }
    }
</script>
</body>
</html>
