<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">⬅ Back to Dashboard</a>
        <span class="text-light" id="cartBadge">Cart: 0 items</span>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">

        <!-- Left Side: Catalog -->
        <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Medicine Catalog</h3>
                <div class="input-group w-50">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search...">
                    <button class="btn btn-primary" onclick="loadCatalog()">Search</button>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="row g-3" id="catalogGrid">
                <!-- Items injected here -->
            </div>
        </div>

        <!-- Right Side: Shopping Cart -->
        <div class="col-md-4">
            <div class="card shadow-sm sticky-top" style="top: 20px;">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">My Shopping Cart</h5>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush" id="cartList">
                        <!-- Cart items injected here -->
                    </ul>
                </div>
                <div class="card-footer bg-white">
                    <div class="d-flex justify-content-between fw-bold mb-3">
                        <span>Total:</span>
                        <span id="cartTotal">$0.00</span>
                    </div>
                    <button class="btn btn-success w-100" onclick="checkout()">Checkout & Pay</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    // Security check
    const userStr = localStorage.getItem('user');
    if (!userStr) window.location.href = 'index.html';
    const user = JSON.parse(userStr);

    // 1. LOAD CATALOG
    async function loadCatalog() {
        const query = document.getElementById('searchInput').value;
        const res = await fetch(`${API_URL}/catalog/search?q=${query}`);
        const items = await res.json();
        const grid = document.getElementById('catalogGrid');
        grid.innerHTML = '';

        if (items.length === 0) {
            grid.innerHTML = '<p class="text-muted">No medicines found.</p>';
            return;
        }

        items.forEach(item => {
            grid.innerHTML += `
                    <div class="col-md-6">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-body">
                                <h5 class="card-title text-primary">${item.name}</h5>
                                <h6 class="card-subtitle mb-2 text-muted">${item.category}</h6>
                                <p class="card-text fw-bold fs-5">$${item.price.toFixed(2)}</p>
                                <button class="btn btn-outline-primary btn-sm w-100" onclick="addToCart(${item.id})">Add to Cart</button>
                            </div>
                        </div>
                    </div>
                `;
        });
    }

    // 2. LOAD CART
    async function loadCart() {
        const res = await fetch(`${API_URL}/cart/${user.id}`);
        const cartItems = await res.json();
        const list = document.getElementById('cartList');
        let total = 0;
        list.innerHTML = '';

        if (cartItems.length === 0) {
            list.innerHTML = '<li class="list-group-item text-muted text-center py-4">Cart is empty</li>';
            document.getElementById('cartBadge').textContent = `Cart: 0 items`;
            document.getElementById('cartTotal').textContent = `$0.00`;
            return;
        }

        cartItems.forEach(item => {
            total += item.total_price;
            list.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="my-0">${item.name}</h6>
                            <small class="text-muted">Qty: ${item.quantity} x $${item.price.toFixed(2)}</small>
                        </div>
                        <div class="text-end">
                            <span class="d-block fw-bold">$${item.total_price.toFixed(2)}</span>
                            <button class="btn btn-link text-danger p-0 border-0" style="font-size: 0.8rem;" onclick="removeFromCart(${item.cart_item_id})">Remove</button>
                        </div>
                    </li>
                `;
        });

        document.getElementById('cartBadge').textContent = `Cart: ${cartItems.length} items`;
        document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
    }

    // 3. ADD TO CART
    async function addToCart(medicineId) {
        await fetch(`${API_URL}/cart`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: user.id, medicine_id: medicineId, quantity: 1 })
        });
        loadCart(); // Refresh cart UI
    }

    // 4. REMOVE FROM CART
    async function removeFromCart(cartItemId) {
        await fetch(`${API_URL}/cart/${cartItemId}`, { method: 'DELETE' });
        loadCart(); // Refresh cart UI
    }

    // 5. CHECKOUT
    async function checkout() {
        const res = await fetch(`${API_URL}/orders/checkout`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: user.id })
        });
        const result = await res.json();

        if (res.ok) {
            alert(`Order placed! Total: $${result.total_amount.toFixed(2)} (Includes $5 delivery fee).`);
            loadCart(); // Clear the cart UI
        } else {
            alert('Checkout failed: ' + result.error);
        }
    }

    // Initialize page
    loadCatalog();
    loadCart();
</script>
</body>
</html>
