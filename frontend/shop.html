<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Shop</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Modern Clinical Theme Customizations */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
        }
        .medical-nav {
            background-color: #00695c !important;
        }
        .content-card {
            border-radius: 12px;
            border: none;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05) !important;
        }
        .search-bar {
            border-radius: 2rem;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark medical-nav shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            <i class="bi bi-arrow-left-short me-1 fs-5 align-middle"></i>Back to Dashboard
        </a>
        <span class="badge bg-light text-dark rounded-pill px-3 py-2 shadow-sm fw-medium fs-6" id="cartBadge">
            <i class="bi bi-cart3 me-1"></i>Cart: 0 items
        </span>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div class="row gap-4 justify-content-center">

        <!-- Left Side: Catalog -->
        <div class="col-lg-7 col-md-12">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <h3 class="fw-bold text-dark mb-0"><i class="bi bi-shop text-primary me-2"></i>Medicine Catalog</h3>
                <div class="input-group shadow-sm search-bar overflow-hidden" style="max-width: 350px;">
                    <span class="input-group-text bg-white border-0 pe-1 text-muted"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchInput" class="form-control border-0 bg-white shadow-none" placeholder="Search medicines...">
                    <button class="btn btn-primary fw-medium px-4" onclick="loadCatalog()">Search</button>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="row g-3" id="catalogGrid">
                <!-- Items injected here -->
            </div>
        </div>

        <!-- Right Side: Shopping Cart -->
        <div class="col-lg-4 col-md-12">
            <div class="card content-card shadow-sm sticky-top" style="top: 20px;">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-bag-heart text-danger me-2"></i>My Shopping Cart</h5>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush" id="cartList">
                        <!-- Cart items injected here -->
                    </ul>
                </div>
                <div class="card-footer bg-white p-4 border-top">
                    <div class="d-flex justify-content-between fw-bold mb-3 fs-5 text-dark">
                        <span>Total:</span>
                        <span id="cartTotal">$0.00</span>
                    </div>
                    <button class="btn btn-success w-100 rounded-pill fw-medium shadow-sm py-2" onclick="checkout()">
                        <i class="bi bi-credit-card me-2"></i>Checkout & Pay
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    // Security check
    const userStr = localStorage.getItem('user');
    if (!userStr) window.location.href = 'index.html';
    const user = JSON.parse(userStr);

    // 1. LOAD CATALOG
    async function loadCatalog() {
        const query = document.getElementById('searchInput').value;
        const res = await fetch(`${API_URL}/catalog/search?q=${query}`);
        const items = await res.json();
        const grid = document.getElementById('catalogGrid');
        grid.innerHTML = '';

        if (items.length === 0) {
            grid.innerHTML = '<div class="col-12 text-center py-5 text-muted"><i class="bi bi-search fs-1 d-block mb-3 opacity-50"></i>No medicines found.</div>';
            return;
        }

        items.forEach(item => {
            grid.innerHTML += `
                    <div class="col-md-6">
                        <div class="card content-card product-card shadow-sm h-100 p-2">
                            <div class="card-body d-flex flex-column">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <div>
                                        <h5 class="card-title text-dark fw-bold mb-1">${item.name}</h5>
                                        <h6 class="card-subtitle small text-muted"><i class="bi bi-tag me-1"></i>${item.category}</h6>
                                    </div>
                                    <i class="bi bi-capsule fs-3 text-primary opacity-25"></i>
                                </div>
                                <p class="card-text fw-bold fs-4 text-success mt-3 mb-4">$${item.price.toFixed(2)}</p>
                                <button class="btn btn-outline-primary btn-sm w-100 rounded-pill fw-medium mt-auto" onclick="addToCart(${item.id})">
                                    <i class="bi bi-cart-plus me-1"></i>Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>
                `;
        });
    }

    // 2. LOAD CART
    async function loadCart() {
        const res = await fetch(`${API_URL}/cart/${user.id}`);
        const cartItems = await res.json();
        const list = document.getElementById('cartList');
        let total = 0;
        list.innerHTML = '';

        if (cartItems.length === 0) {
            list.innerHTML = '<li class="list-group-item text-muted text-center py-5"><i class="bi bi-cart-x fs-2 d-block mb-2 opacity-50"></i>Cart is empty</li>';
            document.getElementById('cartBadge').innerHTML = `<i class="bi bi-cart3 me-1"></i>Cart: 0 items`;
            document.getElementById('cartTotal').textContent = `$0.00`;
            return;
        }

        cartItems.forEach(item => {
            total += item.total_price;
            list.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <div>
                            <h6 class="my-0 fw-bold text-dark">${item.name}</h6>
                            <small class="text-muted">Qty: ${item.quantity} x $${item.price.toFixed(2)}</small>
                        </div>
                        <div class="text-end">
                            <span class="d-block fw-bold text-dark mb-1">$${item.total_price.toFixed(2)}</span>
                            <button class="btn btn-link text-danger p-0 border-0 fw-medium text-decoration-none" style="font-size: 0.85rem;" onclick="removeFromCart(${item.cart_item_id})">
                                <i class="bi bi-trash3 me-1"></i>Remove
                            </button>
                        </div>
                    </li>
                `;
        });

        document.getElementById('cartBadge').innerHTML = `<i class="bi bi-cart-fill text-primary me-1"></i>Cart: ${cartItems.length} items`;
        document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
    }

    // 3. ADD TO CART
    async function addToCart(medicineId) {
        await fetch(`${API_URL}/cart`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: user.id, medicine_id: medicineId, quantity: 1 })
        });
        loadCart(); // Refresh cart UI
    }

    // 4. REMOVE FROM CART
    async function removeFromCart(cartItemId) {
        await fetch(`${API_URL}/cart/${cartItemId}`, { method: 'DELETE' });
        loadCart(); // Refresh cart UI
    }

    // 5. CHECKOUT
    async function checkout() {
        const res = await fetch(`${API_URL}/orders/checkout`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: user.id })
        });
        const result = await res.json();

        if (res.ok) {
            alert(`Order placed! Total: $${result.total_amount.toFixed(2)} (Includes $5 delivery fee).`);
            loadCart(); // Clear the cart UI
        } else {
            alert('Checkout failed: ' + result.error);
        }
    }

    // Initialize page
    loadCatalog();
    loadCart();
</script>
</body>
</html>
