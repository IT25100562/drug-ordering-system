<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Dashboard</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">PharmaCare</a>
        <div class="d-flex align-items-center">
            <span class="text-light me-3" id="userGreeting">Loading...</span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-12 text-center mb-4">
            <h2 id="dashboardTitle">Welcome to your Dashboard</h2>
            <p id="roleBadge"></p>
        </div>
    </div>

    <!-- Dynamic Content Area -->
    <div id="contentArea" class="row justify-content-center gap-3">
        <!-- Specific modules (Cart, Inventory, etc.) will be injected here by JavaScript -->
    </div>
</div>

<script>
    // 1. SECURITY CHECK: Ensure the user is actually logged in
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');

    if (!token || !userStr) {
        // Kick them back to the login page if no token is found
        window.location.href = 'index.html';
    } else {
        // 2. LOAD USER DATA
        const user = JSON.parse(userStr);

        document.getElementById('userGreeting').textContent = `Hello, ${user.full_name}`;

        // Set a color-coded badge based on role
        const badgeClass = (user.role === 'admin' || user.role === 'pharmacist') ? 'bg-danger' : 'bg-success';
        document.getElementById('roleBadge').innerHTML = `<span class="badge ${badgeClass} fs-6">Role: ${user.role.toUpperCase()}</span>`;

        // 3. RENDER DASHBOARD BASED ON ROLE
        renderDashboard(user.role);
    }

    function renderDashboard(role) {
        const contentArea = document.getElementById('contentArea');

        if (role === 'customer') {
            contentArea.innerHTML = `
                    <div class="col-md-3 card shadow-sm text-center p-4">
                        <h4>🛒 Catalog</h4>
                        <p class="text-muted small">Search medicines and add to cart.</p>
                        <button class="btn btn-primary mt-auto" onclick="window.location.href='shop.html'">Go to Shop</button>
                    </div>
                    <div class="col-md-3 card shadow-sm text-center p-4">
                        <h4>📄 Prescriptions</h4>
                        <p class="text-muted small">Upload your medical prescriptions.</p>
                        <button class="btn btn-info text-white mt-auto" onclick="window.location.href='upload.html'">Upload Docs</button>
                    </div>
                    <div class="col-md-3 card shadow-sm text-center p-4">
                        <h4>📦 Orders</h4>
                        <p class="text-muted small">Track deliveries and history.</p>
                        <button class="btn btn-secondary mt-auto" onclick="window.location.href='orders.html'">Track Status</button>
                    </div>
                `;
        } else {
            // Admin / Pharmacist View
            contentArea.innerHTML = `
                    <div class="col-md-3 card shadow-sm text-center p-4">
                        <h4>💊 Inventory</h4>
                        <p class="text-muted small">Add or edit medicine stock.</p>
                        <button class="btn btn-warning mt-auto" onclick="window.location.href='inventory.html'">Manage Stock</button>
                    </div>
                    <div class="col-md-3 card shadow-sm text-center p-4">
                        <h4>✅ Approvals</h4>
                        <p class="text-muted small">Verify customer prescriptions.</p>
                        <button class="btn btn-success mt-auto" onclick="window.location.href='approvals.html'">Review Docs</button>
                    </div>
                    <div class="col-md-3 card shadow-sm text-center p-4">
                        <h4>🚚 Dispatch</h4>
                        <p class="text-muted small">Update delivery statuses.</p>
                        <button class="btn btn-dark mt-auto" onclick="window.location.href='dispatch.html'">Update Orders</button>
                    </div>
                `;
        }
    }

    function logout() {
        // Destroy session data and redirect to login
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
