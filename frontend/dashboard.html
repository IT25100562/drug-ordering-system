<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Dashboard</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Modern Clinical Theme Customizations */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6; /* Softer off-white */
        }
        .medical-nav {
            background-color: #00695c !important; /* Deep professional teal */
        }
        .dashboard-card {
            border-radius: 12px;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important;
        }
        .icon-large {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark medical-nav shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="bi bi-heart-pulse-fill me-2"></i>PharmaCare</a>
        <div class="d-flex align-items-center">
            <span class="text-light me-3 fw-medium" id="userGreeting">Loading...</span>
            <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-12 text-center mb-5">
            <h2 id="dashboardTitle" class="fw-bold text-dark">Welcome to your Dashboard</h2>
            <p id="roleBadge"></p>
        </div>
    </div>

    <!-- Dynamic Content Area -->
    <div id="contentArea" class="row justify-content-center gap-4">
        <!-- Specific modules (Cart, Inventory, etc.) will be injected here by JavaScript -->
    </div>
</div>

<script>
    // 1. SECURITY CHECK: Ensure the user is actually logged in
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');

    if (!token || !userStr) {
        // Kick them back to the login page if no token is found
        window.location.href = 'index.html';
    } else {
        // 2. LOAD USER DATA
        const user = JSON.parse(userStr);

        document.getElementById('userGreeting').textContent = `Hello, ${user.full_name}`;

        // Set a color-coded badge based on role
        const badgeClass = (user.role === 'admin' || user.role === 'pharmacist') ? 'bg-danger' : 'bg-success';
        document.getElementById('roleBadge').innerHTML = `<span class="badge ${badgeClass} rounded-pill px-3 py-2 fw-medium shadow-sm">Role: ${user.role.toUpperCase()}</span>`;

        // 3. RENDER DASHBOARD BASED ON ROLE
        renderDashboard(user.role);
    }

    function renderDashboard(role) {
        const contentArea = document.getElementById('contentArea');

        if (role === 'customer') {
            contentArea.innerHTML = `
                    <div class="col-md-3 card dashboard-card shadow-sm text-center p-4">
                        <i class="bi bi-shop text-primary icon-large"></i>
                        <h4 class="fw-bold mt-2">Catalog</h4>
                        <p class="text-muted small">Search medicines and add to cart.</p>
                        <button class="btn btn-primary rounded-pill fw-medium mt-auto" onclick="window.location.href='shop.html'">Go to Shop</button>
                    </div>
                    <div class="col-md-3 card dashboard-card shadow-sm text-center p-4">
                        <i class="bi bi-file-earmark-medical text-info icon-large"></i>
                        <h4 class="fw-bold mt-2">Prescriptions</h4>
                        <p class="text-muted small">Upload your medical prescriptions.</p>
                        <button class="btn btn-info text-white rounded-pill fw-medium mt-auto" onclick="window.location.href='upload.html'">Upload Docs</button>
                    </div>
                    <div class="col-md-3 card dashboard-card shadow-sm text-center p-4">
                        <i class="bi bi-box-seam text-secondary icon-large"></i>
                        <h4 class="fw-bold mt-2">Orders</h4>
                        <p class="text-muted small">Track deliveries and history.</p>
                        <button class="btn btn-secondary rounded-pill fw-medium mt-auto" onclick="window.location.href='orders.html'">Track Status</button>
                    </div>
                `;
        } else {
            // Admin / Pharmacist View
            contentArea.innerHTML = `
                    <div class="col-md-3 card dashboard-card shadow-sm text-center p-4">
                        <i class="bi bi-capsule text-warning icon-large"></i>
                        <h4 class="fw-bold mt-2">Inventory</h4>
                        <p class="text-muted small">Add or edit medicine stock.</p>
                        <button class="btn btn-warning text-dark rounded-pill fw-medium mt-auto" onclick="window.location.href='inventory.html'">Manage Stock</button>
                    </div>
                    <div class="col-md-3 card dashboard-card shadow-sm text-center p-4">
                        <i class="bi bi-clipboard2-check text-success icon-large"></i>
                        <h4 class="fw-bold mt-2">Approvals</h4>
                        <p class="text-muted small">Verify customer prescriptions.</p>
                        <button class="btn btn-success rounded-pill fw-medium mt-auto" onclick="window.location.href='approvals.html'">Review Docs</button>
                    </div>
                    <div class="col-md-3 card dashboard-card shadow-sm text-center p-4">
                        <i class="bi bi-truck text-dark icon-large"></i>
                        <h4 class="fw-bold mt-2">Dispatch</h4>
                        <p class="text-muted small">Update delivery statuses.</p>
                        <button class="btn btn-dark rounded-pill fw-medium mt-auto" onclick="window.location.href='dispatch.html'">Update Orders</button>
                    </div>
                `;
        }
    }

    function logout() {
        // Destroy session data and redirect to login
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
