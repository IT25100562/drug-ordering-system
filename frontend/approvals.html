<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Review Prescriptions</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Modern Clinical Theme Customizations */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
        }
        .medical-nav {
            background-color: #00695c !important;
        }
        .content-card {
            border-radius: 12px;
            border: none;
            overflow: hidden;
        }
        /* Make table rows slightly more spacious */
        .table > :not(caption) > * > * {
            padding: 1rem 1.5rem;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark medical-nav shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            <i class="bi bi-arrow-left-short me-1 fs-5 align-middle"></i>Back to Dashboard
        </a>
        <span class="text-light fw-medium"><i class="bi bi-shield-lock me-2"></i>Admin Access</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="d-flex align-items-center mb-4">
        <i class="bi bi-clipboard2-check text-success fs-2 me-3"></i>
        <h2 class="fw-bold text-dark mb-0">Review Prescriptions</h2>
    </div>

    <div class="card content-card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th class="text-secondary fw-semibold">ID</th>
                    <th class="text-secondary fw-semibold">User ID</th>
                    <th class="text-secondary fw-semibold">Date Uploaded</th>
                    <th class="text-secondary fw-semibold">Document</th>
                    <th class="text-secondary fw-semibold">Status</th>
                    <th class="text-secondary fw-semibold text-center">Actions</th>
                </tr>
                </thead>
                <tbody id="prescriptionsTable">
                <!-- Prescriptions injected here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';
    const BASE_URL = 'http://localhost:3000'; // To serve the static images

    // Security check
    const userStr = localStorage.getItem('user');
    if (!userStr) window.location.href = 'index.html';
    const user = JSON.parse(userStr);
    if (user.role !== 'admin' && user.role !== 'pharmacist') {
        alert('Access Denied. You do not have admin privileges.');
        window.location.href = 'dashboard.html';
    }

    // 1. LOAD PRESCRIPTIONS
    async function loadPrescriptions() {
        const res = await fetch(`${API_URL}/prescriptions`);
        const records = await res.json();
        const tbody = document.getElementById('prescriptionsTable');
        tbody.innerHTML = '';

        if (records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">No prescriptions found.</td></tr>';
            return;
        }

        records.forEach(record => {
            const date = new Date(record.uploaded_at).toLocaleString();
            const fileUrl = `${BASE_URL}/uploads/${record.file_path}`;

            // Color-code the status
            let badgeColor = 'bg-secondary';
            if (record.status === 'approved') badgeColor = 'bg-success';
            if (record.status === 'rejected') badgeColor = 'bg-danger';
            if (record.status === 'request_fix') badgeColor = 'bg-warning text-dark';
            if (record.status === 'pending') badgeColor = 'bg-primary';

            tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">#${record.id}</td>
                        <td class="fw-medium text-muted">User #${record.user_id}</td>
                        <td class="text-muted">${date}</td>
                        <td>
                            <a href="${fileUrl}" target="_blank" class="btn btn-sm btn-outline-info fw-medium rounded-pill px-3">
                                <i class="bi bi-file-earmark-image me-1"></i>View File
                            </a>
                        </td>
                        <td><span class="badge ${badgeColor} rounded-pill px-3 py-2 fw-medium shadow-sm">${record.status.toUpperCase()}</span></td>
                        <td class="text-center">
                            <div class="btn-group shadow-sm" role="group">
                                <button class="btn btn-sm btn-success fw-medium px-3" onclick="updateStatus(${record.id}, 'approved')" title="Approve">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                                <button class="btn btn-sm btn-warning text-dark fw-medium px-3" onclick="updateStatus(${record.id}, 'request_fix')" title="Ask Fix">
                                    <i class="bi bi-arrow-counterclockwise"></i>
                                </button>
                                <button class="btn btn-sm btn-danger fw-medium px-3" onclick="updateStatus(${record.id}, 'rejected')" title="Reject">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
        });
    }

    // 2. UPDATE STATUS
    async function updateStatus(id, status) {
        const res = await fetch(`${API_URL}/prescriptions/${id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });

        if (res.ok) {
            loadPrescriptions(); // Refresh the table
        } else {
            const data = await res.json();
            alert('Error updating status: ' + data.error);
        }
    }

    // Initialize
    loadPrescriptions();
</script>
</body>
</html>
