<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Review Prescriptions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">⬅ Back to Dashboard</a>
        <span class="text-light">Admin Access</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">✅ Review Customer Prescriptions</h4>
        </div>
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>User ID</th>
                    <th>Date Uploaded</th>
                    <th>Document</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="prescriptionsTable">
                <!-- Prescriptions injected here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';
    const BASE_URL = 'http://localhost:3000'; // To serve the static images

    // Security check
    const userStr = localStorage.getItem('user');
    if (!userStr) window.location.href = 'index.html';
    const user = JSON.parse(userStr);
    if (user.role !== 'admin' && user.role !== 'pharmacist') {
        alert('Access Denied. You do not have admin privileges.');
        window.location.href = 'dashboard.html';
    }

    // 1. LOAD PRESCRIPTIONS
    async function loadPrescriptions() {
        const res = await fetch(`${API_URL}/prescriptions`);
        const records = await res.json();
        const tbody = document.getElementById('prescriptionsTable');
        tbody.innerHTML = '';

        if (records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No prescriptions found.</td></tr>';
            return;
        }

        records.forEach(record => {
            const date = new Date(record.uploaded_at).toLocaleString();
            const fileUrl = `${BASE_URL}/uploads/${record.file_path}`;

            // Color-code the status
            let badgeColor = 'bg-secondary';
            if (record.status === 'approved') badgeColor = 'bg-success';
            if (record.status === 'rejected') badgeColor = 'bg-danger';
            if (record.status === 'request_fix') badgeColor = 'bg-warning text-dark';
            if (record.status === 'pending') badgeColor = 'bg-primary';

            tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">#${record.id}</td>
                        <td>User #${record.user_id}</td>
                        <td>${date}</td>
                        <td>
                            <a href="${fileUrl}" target="_blank" class="btn btn-sm btn-outline-info fw-bold">👁 View File</a>
                        </td>
                        <td><span class="badge ${badgeColor}">${record.status.toUpperCase()}</span></td>
                        <td>
                            <button class="btn btn-sm btn-success" onclick="updateStatus(${record.id}, 'approved')">Approve</button>
                            <button class="btn btn-sm btn-warning text-dark" onclick="updateStatus(${record.id}, 'request_fix')">Ask Fix</button>
                            <button class="btn btn-sm btn-danger" onclick="updateStatus(${record.id}, 'rejected')">Reject</button>
                        </td>
                    </tr>
                `;
        });
    }

    // 2. UPDATE STATUS
    async function updateStatus(id, status) {
        const res = await fetch(`${API_URL}/prescriptions/${id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });

        if (res.ok) {
            loadPrescriptions(); // Refresh the table
        } else {
            const data = await res.json();
            alert('Error updating status: ' + data.error);
        }
    }

    // Initialize
    loadPrescriptions();
</script>
</body>
</html>
