<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catalog & Cart Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        input, button { padding: 5px; margin: 5px 0; }
    </style>
</head>
<body>
<h2>Browsing & Cart Test Panel</h2>

<div class="card">
    <h3>1. Search Medicines</h3>
    <input type="text" id="searchInput" placeholder="Search name or category...">
    <button onclick="searchCatalog()">Search</button>
    <button onclick="searchCatalog('')">View All</button>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="catalogTable"></tbody>
    </table>
</div>

<div class="card">
    <h3>2. My Shopping Cart (Testing as User ID: 1)</h3>
    <button onclick="loadCart()">Refresh Cart</button>
    <table>
        <thead>
        <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="cartTable"></tbody>
    </table>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';
    const TEST_USER_ID = 1; // Testing with the first registered user

    async function searchCatalog(query = null) {
        const q = query !== null ? query : document.getElementById('searchInput').value;
        const res = await fetch(`${API_URL}/catalog/search?q=${q}`);
        const items = await res.json();
        const tbody = document.getElementById('catalogTable');
        tbody.innerHTML = '';

        items.forEach(item => {
            tbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.category}</td>
                        <td>$${item.price}</td>
                        <td><button onclick="addToCart(${item.id})">Add to Cart</button></td>
                    </tr>
                `;
        });
    }

    async function addToCart(medicineId) {
        await fetch(`${API_URL}/cart`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: TEST_USER_ID, medicine_id: medicineId, quantity: 1 })
        });
        alert('Item added to cart!');
        loadCart();
    }

    async function loadCart() {
        const res = await fetch(`${API_URL}/cart/${TEST_USER_ID}`);
        const items = await res.json();
        const tbody = document.getElementById('cartTable');
        tbody.innerHTML = '';

        items.forEach(item => {
            tbody.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>$${item.price}</td>
                        <td>${item.quantity}</td>
                        <td>$${item.total_price}</td>
                        <td><button onclick="removeFromCart(${item.cart_item_id})">Remove</button></td>
                    </tr>
                `;
        });
    }

    // Load initially
    searchCatalog('');
    loadCart();
</script>
</body>
</html>
